[package]
edition = "2021"
license = "MIT"
publish = false
name = "dev-qemu"
version = "0.1.0"

[[bin]]
bench = false
name = "dev-qemu"
test = false

[features]
default = []
# sp-serial off (default): SmbusEspiMedium (the framing ec-test-cli
# speaks). On: MctpSerialMedium / DSP0253 (the framing the SP speaks
# over the two-QEMU link). Pure compile-time selector — both medium
# constructors already exist in uart-service.
sp-serial = []

[profile.release]
lto = true          # better optimizations
codegen-units = 1
debug = true
opt-level = "z"
panic = "abort"
incremental = false

# Optimize dependencies for size but keep root crate unoptimized for better debuggability
[profile.dev.package."*"]
opt-level = "z"

# Uncomment to turn off optimization for specific dependency (such as when debugging a service)
# [profile.dev.package.dependency-name]
# opt-level = 0

[lints.rust]
warnings = "deny"

[lints.clippy]
correctness = "deny"
perf = "deny"
suspicious = "deny"
style = "deny"

# The `embassy_executor::main` macro expands to code referencing `riscv_rt`,
# and `embedded_services::define_static_buffer!` expands to code referencing
# `embassy_sync`, but cargo-machete cannot see through either macro. Keep the
# direct dependencies and tell machete to ignore them.
[package.metadata.cargo-machete]
ignored = ["riscv-rt", "embassy-sync"]

[dependencies]
riscv-rt = "0.17.0"

embassy-qemu-riscv = { git = "https://github.com/kurtjd/qemu-riscv-rs", features = [
    "defmt",
] }
embassy-executor = { version = "0.10.0", features = [
    "platform-riscv32",
    "executor-thread",
    "defmt",
] }

embedded-services = { git = "https://github.com/OpenDevicePartnership/embedded-services", branch = "main", features = [
    "defmt",
] }
uart-service = { git = "https://github.com/OpenDevicePartnership/embedded-services", branch = "main", features = [
    "defmt",
] }
hid-service = { git = "https://github.com/OpenDevicePartnership/embedded-services", branch = "main", features = [
    "defmt",
] }
platform-common = { path = "../platform-common", features = ["mock"] }
embedded-mcu-hal = "0.3.0"

static_cell = "2.1.0"
embassy-sync = "0.8.0"
defmt = "0.3.6"
defmt-semihosting = "0.3.0"
semihosting = { version = "0.1", features = ["panic-handler"] }
