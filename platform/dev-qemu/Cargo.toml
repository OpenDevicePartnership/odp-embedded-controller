[package]
edition = "2021"
license = "MIT"
publish = false
name = "dev-qemu"
version = "0.1.0"

[[bin]]
bench = false
name = "dev-qemu"
test = false

[profile.release]
lto = true          # better optimizations
codegen-units = 1
debug = true
opt-level = "z"
panic = "abort"
incremental = false

# Optimize dependencies for size but keep root crate unoptimized for better debuggability
[profile.dev.package."*"]
opt-level = "z"

# Uncomment to turn off optimization for specific dependency (such as when debugging a service)
# [profile.dev.package.dependency-name]
# opt-level = 0

[lints.rust]
warnings = "deny"

[lints.clippy]
correctness = "deny"
perf = "deny"
suspicious = "deny"
style = "deny"

# The `embassy_executor::main` macro expands to code referencing `riscv_rt`,
# but cargo-machete cannot see through the macro.
[package.metadata.cargo-machete]
ignored = ["riscv-rt"]

[features]
time-alarm-wake = ["dep:time-alarm-service-interface"]
time-alarm-power-input = ["time-alarm-wake"]

[dependencies]
riscv-rt = "0.17.0"

# Restore upstream after the transaction-boundary fix and input-validity support are merged.
embassy-qemu-riscv = { git = "https://github.com/dymk/qemu-riscv-rs", rev = "a1ff86d62c683928464bf310de7d8ad965d5bd9b", features = [
    "defmt",
] }
embassy-executor = { version = "0.10.0", features = [
    "platform-riscv32",
    "executor-thread",
    "defmt",
] }

embedded-services = { git = "https://github.com/OpenDevicePartnership/embedded-services", branch = "main", features = [
    "defmt",
] }
uart-service = { git = "https://github.com/OpenDevicePartnership/embedded-services", branch = "main", features = [
    "defmt",
] }
hidi2c-target-service = { git = "https://github.com/OpenDevicePartnership/embedded-services", branch = "main", features = [
    "defmt",
] }
odp-service-common = { git = "https://github.com/OpenDevicePartnership/embedded-services", branch = "main" }
platform-common = { path = "../platform-common", features = ["mock"] }
time-alarm-service-interface = { git = "https://github.com/OpenDevicePartnership/embedded-services", branch = "main", optional = true }

static_cell = "2.1.0"
typenum = "1.20"
defmt = "0.3.6"
defmt-semihosting = "0.3.0"
semihosting = { version = "0.1", features = ["panic-handler"] }
